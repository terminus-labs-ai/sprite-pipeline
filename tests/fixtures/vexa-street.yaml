# Character kit: one per character/outfit. Reuses the shared motion library.
# Refs are ComfyUI input/ filenames (they live in /data/ai-stack/comfyui/input).
# The face line is appended to the look line only for face_dirs (left-facing
# mirrors of ne/n get no face line, matching batch_dir8.sh).
name: vexa-street
pose_who: "a woman"
pose_strength: 0.75
output_root: /data/artifacts/game-art/vexa
seed: 7
frame_size: 704
pixel_scale: 0.2023
pixel_colors: 40
accent_boost: 3
palette: /data/artifacts/game-art/vexa/master/iso-se.keyed.png
look: "Vexa, an adult woman hacker: dark brunette wolf-cut hair with crimson streaks, amber eyes, light freckles, fitted matte-black techwear jacket with thin glowing teal circuit seams, dark armored plates on the forearms and shins, fingerless gloves, a small holographic wrist display, dark cargo pants and boots. 2D game sprite art, hand-painted cel shading, bold dark outlines, crisp edges. Seen from a high fixed isometric camera looking down at her at about 45 degrees, small in the frame with empty space around her, full body always inside the frame."
face: " She keeps her head up and her face clearly visible, eyes looking ahead in the direction she moves; her hair never covers her eyes."
face_dirs: [s, se, e]
background: " Background description: the background is one perfectly flat uniform chroma-key green, no floor, no shadow, no shapes."
refs:
  s: vexa-ref-s.png
  se: vexa-ref-se.png
  e: vexa-ref-e.png
  ne: vexa-ref-ne.png
  n: vexa-ref-n.png
