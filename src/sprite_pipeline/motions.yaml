# Shared motion library. Drives are character-independent: one per (move, dir),
# cached in motion-cache/ and reused by every kit.
#
# Conventions:
#   clip_length  frames Wan Animate 2 must emit — must be 4n+1.
#   loop         cycle cut by `sprite-gen video-loop`: mode fixed (seamless repeat) or once (play the whole clip).
#   state        sprite-gen detection window: idle|walk|run|jump|attack.
#   directions   unique (right-facing) directions to generate; sw/w/nw are mirrors.
#   head_pitch   degrees the mannequin's head is lifted in the drive (25 keeps faces visible; 0 for moves that look down: hack, hit, death, roll).
#   seam_max     optional sprite-gen loop gate (default 2.0); slow moves like sneak need ~3.0 because a leg cross is a big step against a small mean step.
#   pose_prompt  {who} is replaced by the kit's pose_who.
#   GLB action lengths were read from the animation accessor max (seconds * 24 fps), not guessed.
# Manifests are parsed with PyYAML when importable, otherwise the tiny loader in build.py:
# keep values with colons double-quoted; comments on their own line; flow lists [a, b].

# Relative GLB paths resolve against anim_src in the config (see README).
default_glb: "ual/Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
elev: 45
fps: 30

moves:
  run:
    status: tested
    action: Jog_Fwd_Loop
    repeats: 2
    pre: 1
    post: 0
    head_pitch: 25
    clip_length: 45
    loop_mode: fixed
    loop_start: 1
    loop_length: 22
    state: run
    pose_prompt: "{who} jogging in place, head up"
    directions: [s, se, e, ne, n]
