# Isometric view preset — the prompts that made the guard kit (from the new-kit
# branch: newkit.TURN, dir_prompt, face_line, look_line).
# turn: the direction stills' turn prompt per direction ({pos} is the character's
# possessive). The SE still is the character as provided; its "turn" is the fixed
# facing of the high isometric camera.
view: isometric
camera: "Seen from a high fixed isometric camera looking down at {obj} at about 45 degrees, small in the frame with empty space around {obj}, full body always inside the frame."
face: "{subj} keep{s} {pos} head up and {pos} face clearly visible, eyes looking ahead in the direction {subj} move{s}."
turn:
  s: "turned to face straight down toward the bottom of the image, toward the camera, so we see {pos} front from above"
  se: "kept facing the lower right of the image, toward the camera, so we see {pos} front from above"
  e: "turned to face directly toward the right side of the image, seen in side profile from above"
  ne: "turned away from the camera, facing toward the upper right of the image, so we see {pos} back and the back of {pos} head from above at three-quarters"
  n: "turned fully away from the camera, facing straight up toward the top of the image, so we see only {pos} back and the back of {pos} head from above"
